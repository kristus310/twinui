name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Flutter (version from .flutter-version, official repo)
        run: |
          version="$(tr -d '[:space:]' < .flutter-version)"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Security scan selftest
        run: scripts/scan_selftest.sh

      - name: Security scan, analyzer, tests
        run: scripts/check.sh
